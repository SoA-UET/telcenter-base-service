<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telcenter S04 - Customer Identity Service Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .oauth-button {
            background: #4285f4;
            margin-top: 10px;
        }

        .response-card {
            grid-column: 1 / -1;
        }

        .response-content {
            background: #f5f5f5;
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .success {
            color: #4caf50;
            font-weight: bold;
        }

        .error {
            color: #f44336;
            font-weight: bold;
        }

        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .info h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .info ul {
            margin-left: 20px;
        }

        .info li {
            margin-bottom: 5px;
        }

        .token-display {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            word-break: break-all;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Telcenter Customer Identity Service</h1>
            <p>Test Interface for S04 APIs</p>
        </div>

        <div class="main-content">
            <!-- Registration Card -->
            <div class="card">
                <h2>Dang ky tai khoan</h2>
                <div class="info">
                    <h3>Yeu cau:</h3>
                    <ul>
                        <li>Email</li>
                        <li>Mat khau: toi thieu 8 ky tu, co chu hoa, chu thuong, so va ky tu dac biet</li>
                    </ul>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="text" id="reg_email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mat khau:</label>
                        <input type="password" id="reg_password" placeholder="P@ssw0rd123" required>
                    </div>
                    <div class="form-group">
                        <label>Ho va ten:</label>
                        <input type="text" id="reg_fullname" placeholder="Nguyen Van A" required>
                    </div>
                    <div class="form-group">
                        <label>Dia chi:</label>
                        <input type="text" id="reg_address" placeholder="TP. Ho Chi Minh" required>
                    </div>
                    <button type="submit">Dang ky</button>
                </form>
            </div>

            <!-- Login Card -->
            <div class="card">
                <h2>Dang nhap</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="text" id="login_email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mat khau:</label>
                        <input type="password" id="login_password" placeholder="P@ssw0rd123" required>
                    </div>
                    <button type="submit">Dang nhap</button>
                </form>
                
                <button class="oauth-button" onclick="loginWithGoogle()">
                    Dang nhap voi Google
                </button>
                
                <div id="tokenDisplay" class="token-display" style="display: none;">
                    <strong>Access Token:</strong>
                    <div id="tokenValue"></div>
                </div>
            </div>

            <!-- Response Card -->
            <div class="card response-card">
                <h2>Ket qua</h2>
                <div class="response-content" id="responseContent">
                    Chua co yeu cau nao duoc thuc hien...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api/v1';
        let accessToken = null;

        function displayResponse(title, data, isSuccess = true) {
            const responseDiv = document.getElementById('responseContent');
            const statusClass = isSuccess ? 'success' : 'error';
            const timestamp = new Date().toLocaleString('vi-VN');
            
            responseDiv.innerHTML = `
<span class="${statusClass}">[${timestamp}] ${title}</span>

${JSON.stringify(data, null, 2)}
            `;
        }

        // Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('reg_email').value,
                password: document.getElementById('reg_password').value,
                full_name: document.getElementById('reg_fullname').value,
                address: document.getElementById('reg_address').value
            };

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                displayResponse('DANG KY', result, response.ok);
                
                if (response.ok) {
                    alert('Dang ky thanh cong! Ban co the dang nhap ngay bay gio.');
                    document.getElementById('registerForm').reset();
                }
            } catch (error) {
                displayResponse('LOI', { error: error.message }, false);
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('login_email').value,
                password: document.getElementById('login_password').value
            };

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                displayResponse('DANG NHAP', result, response.ok);
                
                if (response.ok && result.access_token) {
                    accessToken = result.access_token;
                    document.getElementById('tokenDisplay').style.display = 'block';
                    document.getElementById('tokenValue').textContent = accessToken;
                    alert('Dang nhap thanh cong!');
                }
            } catch (error) {
                displayResponse('LOI', { error: error.message }, false);
            }
        });

        // OAuth Login
        function loginWithGoogle() {
            window.location.href = `${API_BASE}/auth/oauth/login?provider=google`;
        }

        // Test JWKS endpoint
        async function testJWKS() {
            try {
                const response = await fetch('http://localhost:5000/.well-known/jwks.json');
                const result = await response.json();
                displayResponse('JWKS ENDPOINT', result, response.ok);
            } catch (error) {
                displayResponse('LOI', { error: error.message }, false);
            }
        }

        // Add JWKS test button on load
        window.addEventListener('load', () => {
            const responseCard = document.querySelector('.response-card');
            const testButton = document.createElement('button');
            testButton.textContent = 'Kiem tra JWKS Endpoint';
            testButton.style.marginTop = '10px';
            testButton.onclick = testJWKS;
            responseCard.appendChild(testButton);
        });
    </script>
</body>
</html>
